  <text x="180" y="110" font-size="52" font-family="serif" fill="#1D9E75" font-style="italic">
    problem
  </text>

  <text x="60" y="170" font-size="52" font-family="serif" fill="#111">
    to solution.
  </text>

  <!-- Tagline -->
  <text x="60" y="220" font-size="18" fill="#555">
