    <rect x="460" y="340" rx="12" ry="12" width="140" height="30" fill="#FAEEDA" stroke="#EF9F27"/>
    <text x="475" y="360" fill="#854F0B">AWS SageMaker</text>

    <rect x="610" y="340" rx="12" ry="12" width="140" height="30" fill="#FAECE7" stroke="#F0997B"/>
    <text x="625" y="360" fill="#993C1D">Computer Vision</text>
  </g>

