  </text>

  <!-- Cards -->
  <g>
    <rect x="95" y="595" width="230" height="110" rx="12" fill="#11161C" stroke="#222"/>
    <text x="115" y="625" fill="#FFF" font-size="14">Experimental Design</text>
    <text x="115" y="655" fill="#888" font-size="12">Data-driven decision systems</text>

    <rect x="345" y="595" width="230" height="110" rx="12" fill="#11161C" stroke="#222"/>
    <text x="365" y="625" fill="#FFF" font-size="14">ML Pipelines</text>
    <text x="365" y="655" fill="#888" font-size="12">End-to-end production pipelines</text>

    <rect x="595" y="595" width="230" height="110" rx="12" fill="#11161C" stroke="#222"/>
    <text x="615" y="625" fill="#FFF" font-size="14">Computer Vision</text>
    <text x="615" y="655" fill="#888" font-size="12">Deep learning applications</text>

    <rect x="845" y="595" width="230" height="110" rx="12" fill="#11161C" stroke="#222"/>
    <text x="865" y="625" fill="#FFF" font-size="14">RAG Chatbots</text>
    <text x="865" y="655" fill="#888" font-size="12">LLM-powered retrieval systems</text>
  </g>

  <!-- Footer -->
  <text x="95" y="735" font-size="14" fill="#888">
