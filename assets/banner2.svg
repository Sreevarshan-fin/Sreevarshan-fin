<svg width="1200" height="750" viewBox="0 0 1200 750"
     xmlns="http://www.w3.org/2000/svg"
     style="display:block; margin:0; padding:0;">

  <!-- Outer White Background (Border Effect) -->
  <rect x="0" y="0" width="1200" height="750" fill="#FFFFFF"/>

  <!-- Inner Dark Container -->
  <rect x="15" y="15" width="1170" height="720" fill="#0B0F14" rx="10"/>

  <!-- Shift everything inside (padding offset = +15px) -->

  <!-- Header -->
  <text x="95" y="85" font-size="14" fill="#7A7A7A" letter-spacing="3">
    DATA SCIENCE &amp; AI · END-TO-END SOLUTIONS
  </text>

  <!-- Headline -->
  <text x="95" y="165" font-size="72" fill="#FFFFFF" font-family="serif">From</text>
  <text x="275" y="165" font-size="72" fill="#1D9E75" font-style="italic" font-family="serif">problem</text>
  <text x="95" y="255" font-size="72" fill="#FFFFFF" font-family="serif">to solution.</text>

  <!-- Tagline -->
  <text x="95" y="315" font-size="22" fill="#A0A0A0">
    Building Machine Learning and Generative AI systems —
  </text>
  <text x="95" y="345" font-size="22" fill="#A0A0A0">
    from LLMs to RAG, designed for scale and business impact.
  </text>

  <!-- Credibility -->
  <text x="95" y="370" font-size="18" fill="#6FCF97">
    End-to-end solutions from data to deployment.
  </text>

  <!-- Divider -->
  <line x1="95" y1="395" x2="1105" y2="395" stroke="#222"/>

  <!-- Focus -->
  <text x="95" y="435" font-size="12" fill="#777" letter-spacing="2">
    FOCUS AREAS
  </text>

  <!-- Tags -->
  <g font-size="13">

    <!-- Row 1 -->
    <rect x="95" y="455" rx="15" width="160" height="34" fill="#122A23" stroke="#1D9E75"/>
    <text x="110" y="477" fill="#1D9E75">Machine Learning</text>

    <rect x="265" y="455" rx="15" width="140" height="34" fill="#14243A" stroke="#4A90E2"/>
    <text x="280" y="477" fill="#4A90E2">Deep Learning</text>

    <rect x="415" y="455" rx="15" width="130" height="34" fill="#1E1B3A" stroke="#7B61FF"/>
    <text x="430" y="477" fill="#7B61FF">LLMs &amp; RAG</text>

    <rect x="555" y="455" rx="15" width="160" height="34" fill="#3A2A14" stroke="#F5A623"/>
    <text x="570" y="477" fill="#F5A623">AWS SageMaker</text>

    <rect x="725" y="455" rx="15" width="170" height="34" fill="#3A1F1A" stroke="#F76C5E"/>
    <text x="740" y="477" fill="#F76C5E">Computer Vision</text>

    <!-- Row 2 -->
    <rect x="95" y="505" rx="15" width="90" height="34" fill="#14243A" stroke="#4A90E2"/>
    <text x="115" y="527" fill="#4A90E2">NLP</text>

    <rect x="195" y="505" rx="15" width="130" height="34" fill="#1E1B3A" stroke="#7B61FF"/>
    <text x="210" y="527" fill="#7B61FF">Agentic AI</text>

    <rect x="335" y="505" rx="15" width="150" height="34" fill="#3A2A14" stroke="#F5A623"/>
    <text x="350" y="527" fill="#F5A623">Python · SQL</text>

    <rect x="495" y="505" rx="15" width="120" height="34" fill="#122A23" stroke="#1D9E75"/>
    <text x="510" y="527" fill="#1D9E75">Statistics</text>

    <rect x="625" y="505" rx="15" width="150" height="34" fill="#14243A" stroke="#4A90E2"/>
    <text x="640" y="527" fill="#4A90E2">Data Analysis</text>

    <rect x="785" y="505" rx="15" width="120" height="34" fill="#1E1B3A" stroke="#7B61FF"/>
    <text x="800" y="527" fill="#7B61FF">MLOps</text>

  </g>

  <!-- Projects -->
  <text x="95" y="575" font-size="12" fill="#777" letter-spacing="2">
