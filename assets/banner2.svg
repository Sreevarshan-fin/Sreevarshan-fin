  </text>

  <!-- Divider -->
  <line x1="60" y1="280" x2="840" y2="280" stroke="#DDD"/>

  <!-- Core Expertise -->
  <text x="60" y="320" font-size="11" fill="#8A8A8A" letter-spacing="2">
