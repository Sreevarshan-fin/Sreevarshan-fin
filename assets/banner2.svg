  </text>

  <!-- Tags -->
  <g font-size="12" font-family="sans-serif">
    <rect x="60" y="340" rx="12" ry="12" width="140" height="30" fill="#E1F5EE" stroke="#5DCAA5"/>
    <text x="75" y="360" fill="#0F6E56">Machine Learning</text>

    <rect x="210" y="340" rx="12" ry="12" width="120" height="30" fill="#E6F1FB" stroke="#85B7EB"/>
    <text x="225" y="360" fill="#185FA5">Deep Learning</text>

    <rect x="340" y="340" rx="12" ry="12" width="110" height="30" fill="#EEEDFE" stroke="#AFA9EC"/>
